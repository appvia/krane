# Default values for krane.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: quay.io/appvia/krane
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

params:
  reportInterval: 30
  reportOutput: none
  falkorDBHost: falkordb
  slackWebhookURL: ""
  slackChannel: ""
  # RBAC installed and reconciled by a managed control plane - EKS, GKE, AKS,
  # OpenShift - is classified alongside the roles Kubernetes bootstraps, and so
  # skipped by the risk rules that already exclude those. Set to false to have it
  # judged like operator authored RBAC instead.
  treatVendorManagedRolesAsDefault: true

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "krane-sa"

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# The Krane dashboard has no authentication: anything that can reach the service
# can read your cluster's RBAC. It is a ClusterIP for that reason — use
# `kubectl port-forward`, a NetworkPolicy, or an authenticating proxy rather than
# exposing it.
service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 1
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 20Mi


nodeSelector: {}

tolerations: []

affinity: {}

# Dependencies
falkordb:
  image: falkordb/falkordb
  tag: v4.20.3
  # The image defaults cap result sets at 10k rows and read queries at 1s, which
  # would silently truncate reports on a large cluster. Krane needs whole result
  # sets, the way RedisGraph served them.
  args: "MAX_QUEUED_QUERIES 25 TIMEOUT_MAX 0 RESULTSET_SIZE -1"
  # Krane talks to the graph directly, so the bundled web UI is dead weight
  # - and it accounts for most of the idle memory footprint.
  browser: 0
