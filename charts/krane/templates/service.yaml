# FalkorDB
---
apiVersion: v1
kind: Service
metadata:
  name: falkordb
  labels:
    {{- include "krane.labels" . | nindent 4 }}
spec:
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP
  selector:
    {{- include "krane.falkordbSelectorLabels" . | nindent 4 }}

# Krane
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "krane.fullname" . }}
  labels:
    {{- include "krane.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    {{- include "krane.selectorLabels" . | nindent 4 }}
