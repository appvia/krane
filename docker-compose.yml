version: '3.7'

services:

  falkordb:
    image: falkordb/falkordb:v4.20.3
    container_name: falkordb
    ports:
      - 6379:6379
    environment:
      # The image defaults cap result sets at 10k rows and read queries at 1s,
      # which would silently truncate reports on a large cluster. Krane needs
      # whole result sets, the way RedisGraph served them.
      FALKORDB_ARGS: 'MAX_QUEUED_QUERIES 25 TIMEOUT_MAX 0 RESULTSET_SIZE -1'
      # Krane talks to the graph directly, so the bundled web UI is dead weight
      # - and it accounts for most of the idle memory footprint.
      BROWSER: '0'
    deploy:
      replicas: 1
      labels:
        io.appvia.krane/version: "${KRANE_VERSION}"
      resources:
        limits:
          cpus: '1'
          memory: 200M
        reservations:
          cpus: '0.2'
          memory: 20M
    networks:
      - default

  krane:
    build: .
    image: quay.io/appvia/krane:latest
    container_name: krane
    ports:
      - "8000:8000"
    depends_on:
      - falkordb
    deploy:
      replicas: 1
      labels:
        io.appvia.krane/version: "${KRANE_VERSION}"
      resources:
        limits:
          cpus: '1'
          memory: 400M
        reservations:
          cpus: '0.2'
          memory: 20M
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "bin/krane --version"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      KRANE_REPORT_INTERVAL: 30
      KRANE_REPORT_OUTPUT: 'none'
      FALKORDB_HOST: 'falkordb'
      SLACK_WEBHOOK_URL: ''
      SLACK_CHANNEL: ''
    networks:
      - default

networks:
  default:
